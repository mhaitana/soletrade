name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm build
      - run: pnpm mobile:export
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:56421
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
