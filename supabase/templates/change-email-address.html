<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soletrade</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fafaf9;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #fafaf9"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <!--[if mso]><table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #e7e5e4;
              border-radius: 12px;
            "
          >
            <tr>
              <td style="padding: 32px 32px 24px">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td width="40" valign="middle">
                      <img
                        src="https://business.soletrade.example/icons/soletrade-v1/icon-192x192.png"
                        width="40"
                        height="40"
                        alt=""
                        style="display: block; border: 0; border-radius: 8px"
                      />
                    </td>
                    <td
                      valign="middle"
                      style="
                        padding-left: 12px;
                        font-size: 20px;
                        line-height: 28px;
                        font-weight: 700;
                        color: #1c1917;
                      "
                    >
                      Soletrade
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 20px">
                <h2
                  style="
                    margin: 0 0 20px;
                    font-size: 24px;
                    line-height: 32px;
                    font-weight: 700;
                    color: #1c1917;
                  "
                >
                  Confirm your new email address
                </h2>

                <p style="margin: 0 0 20px; font-size: 16px; line-height: 26px; color: #44403c">
                  Follow the link below to confirm {{ .NewEmail }} as your new email address.
                </p>
                <p style="margin: 0 0 20px; font-size: 16px; line-height: 26px; color: #44403c">
                  <a
                    style="
                      display: inline-block;
                      background-color: #2563eb;
                      border-radius: 6px;
                      padding: 12px 20px;
                      color: #ffffff;
                      font-size: 16px;
                      line-height: 24px;
                      font-weight: 600;
                      text-decoration: none;
                    "
                    href="{{ .ConfirmationURL }}"
                    >Confirm new email address</a
                  >
                </p>

                <p style="margin: 0 0 20px; font-size: 16px; line-height: 26px; color: #44403c">
                  If you didn't request this change, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  border-top: 1px solid #e7e5e4;
                  font-size: 12px;
                  line-height: 20px;
                  color: #78716c;
                "
              >
                Soletrade is a product of Matt Haitana.<br />&copy; 2026 Matt Haitana
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
